name: Release build

# Manual only: builds the .run installer and the AppImage and attaches them to a DRAFT
# release for the given tag. Nothing is published automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the packages to (the draft is created if missing)
        required: true
        default: v1.4.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the Android runtime under drm/ (about 66 MB per run)
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvlc-dev vlc zstd build-essential
      - run: npm ci
        working-directory: electron
      - name: Build the installer
        env:
          ADAM_VLC_LIBDIR: /usr/lib/x86_64-linux-gnu
          ADAM_VLC_PLUGINS: /usr/lib/x86_64-linux-gnu/vlc/plugins
        run: scripts/build-installer.sh
      - name: Build the AppImage
        env:
          ADAM_VLC_LIBDIR: /usr/lib/x86_64-linux-gnu
          ADAM_VLC_PLUGINS: /usr/lib/x86_64-linux-gnu/vlc/plugins
        working-directory: electron
        run: npm run dist
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes-file "releases/${TAG}.md"
          gh release upload "$TAG" dist/adam.run electron/dist/adam.AppImage --clobber

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VLC
        run: choco install vlc --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: scripts\build-windows.ps1 -Msys C:\msys64\ucrt64\bin
      - name: Attach to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --draft --title $env:TAG --notes-file "releases/$($env:TAG).md" }
          gh release upload $env:TAG (Get-ChildItem electron\dist\adam-setup-*.exe).FullName --clobber
