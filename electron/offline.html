<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://music.apple.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #f5f5f7;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box; text-align: center; -webkit-app-region: drag; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  p  { margin: 0; color: #a1a1a6; max-width: 34em; }
  small { color: #6e6e73; }
  button { -webkit-app-region: no-drag; margin-top: 8px; padding: 9px 22px; border: 0; border-radius: 8px;
    background: #fc3c44; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<main role="main">
  <h1 id="title">Adam</h1>
  <p id="msg">Apple Music could not be loaded.</p>
  <p>Adam will reconnect on its own as soon as the network is back.</p>
  <button id="retry" type="button">Try again</button>
  <small id="detail"></small>
</main>
<script>
  const target = 'https://music.apple.com/';
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('m')) document.getElementById('msg').textContent = q.get('m') + '.';
  if (q.get('d')) document.getElementById('detail').textContent = q.get('d');
  const go = () => { location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
  // Probe quietly; only navigate once Apple Music answers, so a dead network does not flash-reload.
  setInterval(() => { fetch(target, { mode: 'no-cors', cache: 'no-store' }).then(go, () => {}); }, 6000);
</script>
</body>
</html>
